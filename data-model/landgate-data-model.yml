identifiers:
  - id: LGATE-nnn
    description: Landgate product code used in dataset titles and SLIP layer names, e.g.
      LGATE-217 Cadastre (Polygon), LGATE-233 LGA Boundaries.
    authoritative: true
  - id: AGENCY-nnn suffix on WFS type names
    description: WFS feature types carry the custodian agency code, e.g. DFES-015, DBCA-022,
      NNTT-001 — the SLIP public tier aggregates other WA agencies' data, not only Landgate's.
  - id: volume/folio
    description: Certificate of Title identifier for WA land. Not present on any public API
      surface — it lives behind the gated registry.
  - id: RESO UPI
    present: false
    note: not used; see review.yml
