note: |
  SCOPE CAVEAT, read this first. Landgate publishes no API changelog and no release notes for
  the SLIP or Data WA services. What it publishes is the Customer Information Bulletin (CIB) —
  a numbered, monthly, dated stream announcing changes to land-transaction practice, forms,
  fees, systems and outages. That is the provider's real change-communication channel for its
  services, and it is captured here as such. It is NOT an API changelog: none of the entries
  below describe a change to an endpoint, schema or contract.
