note: |
  Landgate publishes NO MCP server. Searched 2026-07-26: no mcp.* host, no MCP reference on
  landgate.wa.gov.au or data.wa.gov.au, no /.well-known/ai-plugin.json on any host, nothing in
  the Landgate GitHub org, and no npm package. `status: candidate` — the tools below are an
  API Evangelist proposal derived one-for-one from operations that were verified callable
  anonymously, not something Landgate operates.

  Why this is worth proposing: the public tier is entirely anonymous and read-only, which is
  the easiest possible MCP surface to stand up — no token exchange, no consent, no write
  consequence. See agentic-access/landgate-agentic-access.yml, where all 27 operations
  classify as connected/read.
