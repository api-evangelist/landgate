notes:
  imageChoice: The shared APIs.json network placeholder image is used. No Landgate
    favicon or brand icon was trivially retrievable (favicon.ico returned 404).
  homonymWarning: |
    "Landgate" is a homonym. https://www.linkedin.com/company/landgate resolves to a
    page titled "LandGate", which is a different company (a US land/energy data
    marketplace at landgate.com) and NOT the Western Australian Land Information
    Authority. It was deliberately excluded from apis.yml. Any future enrichment must
    not attach landgate.com assets, social accounts, or APIs to this record.
  scopeBoundary: This bootstrap covers identity, honest public-API posture, and spec
    harvest only. No enrichment artifacts were generated.
