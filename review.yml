    organization located for the WA Landgate.
  postman: none published — no Postman workspace or collection located.
  cli: none published.
  statusPage: none located.
  changelog: none located for the data services.
marketPosition:
  role: Western Australian state land registry, statutory valuer, and custodian of the
    state's foundational location data.
  valueChain: |
    Sits beneath the Australian portal duopoly (REA Group's realestate.com.au and
    Domain) and beneath PEXA's electronic conveyancing rail. Portals and valuation
    vendors (PropTrack, CoreLogic) consume registry-derived attributes and sales
    evidence; Landgate is one of the state-level sources those chains rest on. Landgate
    publishes an explicit "product on-sellers" page, which is the plainest possible
    statement that the intended distribution model for its data is through licensed
    commercial resellers rather than through a public API.
  privatisationNote: |
    Western Australia is one of the Australian states that commercialised registry
    operations — the automated land titling and registry operating functions were
    transferred under a long-term commercial services arrangement in 2019 while
    Landgate retained the Registrar of Titles statutory function and data custodianship.
    Recorded here because a privatised registry selling the public record back to the
    market is itself the finding for this tier; the specific corporate details of the
    operator were not independently verified during this bootstrap and are deliberately
    left unnamed rather than asserted.
  eConveyancing:
    note: Landgate publishes an e-conveyancing toolkit for WA practitioners. Electronic
      lodgement in WA runs through the national Electronic Lodgement Network; no
      Landgate-published API for lodgement was located, and none is offered to general
      developers.
    url: https://www.landgate.wa.gov.au/land-and-property/electronic-conveyancing/e-conveyancing-toolkit/
