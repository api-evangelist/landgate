- aid: landgate:slip-public-ogc-services
  name: SLIP Public OGC Web Services (WMS / WFS)
  description: OGC-standard web services fronting the same SLIP public data. A WMS 1.3.0 GetCapabilities
    document (56 layers) and a WFS 2.0.0 GetCapabilities document (38 feature types) were both
    retrieved anonymously with HTTP 200 on 2026-07-26 and are saved verbatim. These GetCapabilities
    documents are the machine-readable contract for this surface — there is no OpenAPI and no
    OData $metadata anywhere on the Landgate estate.
  humanURL: https://www.landgate.wa.gov.au/location-data-and-services/programs-and-initiatives/slip/
  baseURL: https://public-services.slip.wa.gov.au/public/services
