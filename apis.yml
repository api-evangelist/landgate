apis:
- aid: landgate:slip-public-arcgis-rest-services
  name: SLIP Public Services (ArcGIS REST)
  description: The public tier of Landgate's Shared Location Information Platform (SLIP),
    served as an Esri ArcGIS Server 12.1 REST services directory. Confirmed anonymously
    reachable on 2026-07-26 with HTTP 200 and authInfo.isTokenBasedSecurity false —
    65 map services across five folders (SLIP_Public_Services with 57 services, plus
    Landgate_Public_Maps, Landgate_Public_Imagery, Land_Monitor and Utilities), covering
    cadastre, administrative and LGA boundaries, buildings and structures, bushfire
    prone areas, climate, disaster, transport and marine layers. A live layer query
    (SLIP_Public_Services/Boundaries/MapServer/14/query) returned real LGA boundary
    features without any credential.
  humanURL: https://www.landgate.wa.gov.au/location-data-and-services/programs-and-initiatives/slip/
  baseURL: https://public-services.slip.wa.gov.au/public/rest/services
  tags:
  - Geospatial
  - Cadastre
  - Boundaries
  - Open Access
  - ArcGIS
  properties:
  - type: ArcGIS
    url: openapi/landgate-slip-public-arcgis-rest-services.json
  - type: ArcGIS
    url: openapi/landgate-slip-public-services-folder.json
  - type: APIReference
    url: https://public-services.slip.wa.gov.au/public/rest/services?f=json
  - type: Documentation
    url: https://www.landgate.wa.gov.au/location-data-and-services/programs-and-initiatives/slip/
  - type: Documentation
    url: https://maps.slip.wa.gov.au/landgate/locate/
- aid: landgate:slip-public-ogc-services
  name: SLIP Public OGC Web Services (WMS / WFS)
  description: OGC-standard web services fronting the same SLIP public data. A WMS 1.3.0
    GetCapabilities document (56 layers) and a WFS 2.0.0 GetCapabilities document (38
    feature types) were both retrieved anonymously with HTTP 200 on 2026-07-26 and are
    saved verbatim. These GetCapabilities documents are the machine-readable contract
    for this surface — there is no OpenAPI and no OData $metadata anywhere on the
    Landgate estate.
  humanURL: https://www.landgate.wa.gov.au/location-data-and-services/programs-and-initiatives/slip/
  baseURL: https://public-services.slip.wa.gov.au/public/services
  tags:
  - Geospatial
  - OGC
  - WMS
  - WFS
  - Open Access
  properties:
  - type: GetCapabilities
    url: openapi/landgate-slip-public-wms-capabilities.xml
  - type: GetCapabilities
    url: openapi/landgate-slip-public-wfs-capabilities.xml
  - type: WMS
    url: https://services.slip.wa.gov.au/public/services/SLIP_Public_Services/Boundaries/MapServer/WMSServer?request=GetCapabilities&service=WMS
  - type: Documentation
    url: https://www.landgate.wa.gov.au/location-data-and-services/discovering-landgate-data/
- aid: landgate:data-wa-ckan-action-api
  name: Data WA CKAN Action API
  description: Landgate leads implementation of the WA Whole of Government Open Data
    Policy and operates data.wa.gov.au, whose catalogue runs CKAN with the standard
    /api/3/action surface exposed anonymously. Confirmed 2026-07-26 — status_show,
    package_search, package_list and organization_show all returned HTTP 200 without
    credentials; the catalogue holds 2,872 datasets, of which 395 are published by the
    Landgate organization. A DCAT JSON-LD catalog is served at /catalog.jsonld. Note
    honestly that the API is open but most Landgate datasets in it carry a custom
    Landgate licence rather than an open licence (371 of 395 are license_id
    custom_other; only 2 are public domain and 5 are CC non-commercial).
  humanURL: https://www.data.wa.gov.au/
  baseURL: https://catalogue.data.wa.gov.au/api/3/action
  tags:
  - Open Data
