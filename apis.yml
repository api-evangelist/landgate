- aid: landgate:data-wa-ckan-action-api
  name: Data WA CKAN Action API
  description: Landgate leads implementation of the WA Whole of Government Open Data Policy and
    operates data.wa.gov.au, whose catalogue runs CKAN with the standard /api/3/action surface
    exposed anonymously. Confirmed 2026-07-26 — status_show, package_search, package_list and
    organization_show all returned HTTP 200 without credentials; the catalogue holds 2,872 datasets,
    of which 395 are published by the Landgate organization. A DCAT JSON-LD catalog is served
    at /catalog.jsonld. Note honestly that the API is open but most Landgate datasets in it carry
    a custom Landgate licence rather than an open licence (371 of 395 are license_id custom_other;
    only 2 are public domain and 5 are CC non-commercial).
  humanURL: https://www.data.wa.gov.au/
  baseURL: https://catalogue.data.wa.gov.au/api/3/action
  tags:
  - Open Data
  - Catalog
  - CKAN
  - DCAT
  - Government
