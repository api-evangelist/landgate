apis:
- aid: landgate:slip-public-arcgis-rest-services
  name: SLIP Public Services (ArcGIS REST)
  description: The public tier of Landgate's Shared Location Information Platform (SLIP), served
    as an Esri ArcGIS Server 12.1 REST services directory. Confirmed anonymously reachable on
    2026-07-26 with HTTP 200 and authInfo.isTokenBasedSecurity false — 65 map services across
    five folders (SLIP_Public_Services with 57 services, plus Landgate_Public_Maps, Landgate_Public_Imagery,
    Land_Monitor and Utilities), covering cadastre, administrative and LGA boundaries, buildings
    and structures, bushfire prone areas, climate, disaster, transport and marine layers. A live
    layer query (SLIP_Public_Services/Boundaries/MapServer/14/query) returned real LGA boundary
    features without any credential.
  humanURL: https://www.landgate.wa.gov.au/location-data-and-services/programs-and-initiatives/slip/
  baseURL: https://public-services.slip.wa.gov.au/public/rest/services
