aid: landgate
url: https://raw.githubusercontent.com/api-evangelist/landgate/refs/heads/main/apis.yml
name: Landgate
kind: company
description: Landgate is the Western Australian Land Information Authority — the WA
  government agency that maintains the state land titles register, values every rateable
  property in Western Australia, and curates the state's foundational location data
  (cadastre, tenure, property addresses, sales evidence, imagery, elevation, geographic
  names). In the Australian real estate value chain Landgate sits underneath the listing
  portals (REA Group's realestate.com.au and Domain) and underneath PEXA's electronic
  conveyancing rail as the authoritative source of the public land record for WA; since
  2019 the automated land titling and registry operations have been operated under a
  commercial services arrangement while Landgate retains the Registrar of Titles function
  and the data custodianship. Its API posture is genuinely split and should not be
  overstated — a real, anonymously callable public surface exists (the SLIP Shared Location
  Information Platform ArcGIS REST directory plus OGC WMS/WFS services, and the Data WA
  CKAN Action API that Landgate operates for the whole WA public sector), while the
  richer registry and subscription data sits behind SLIP subscription, transaction,
  publication, broker, distributor and value-added-reseller licences that must be signed
  and, for bulk downloads, behind a MyLandgate account login. There is no developer
  portal, no published OpenAPI, no API key self-service, and no RESO involvement of any
  kind — RESO is a North American MLS standard and is absent from this Australian
  government registry.
