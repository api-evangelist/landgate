- aid: landgate:mylandgate-openid-connect
  name: MyLandgate OpenID Connect / OAuth 2.0 (PingFederate)
  description: Landgate's customer identity provider, running PingFederate. The OpenID Connect
    discovery document is served anonymously (HTTP 200, 2026-07-26) at /.well-known/openid-configuration
    and is saved verbatim. It is a real, machine-readable authorization-server contract — but
    it is the sign-on for MyLandgate, Land Enquiry Services and SLIP subscriber accounts, not
    a public developer API. There is no public client registration endpoint, no published scope
    catalogue beyond the standard openid/profile/email/address/phone plus an ATO scope, and no
    developer documentation. Listed here because the artifact is genuine, not because it is self-serve.
  humanURL: https://land-enquiry.app.landgate.wa.gov.au/
  baseURL: https://sign-on.app.landgate.wa.gov.au
  tags:
  - Authentication
  - OpenID Connect
  - OAuth 2.0
  - Gated
